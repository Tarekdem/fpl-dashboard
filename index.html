const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function unlockWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.nonce)},key,b64(DATA.ct));
  const html=new TextDecoder().decode(pt);
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#12001a";
  fr.setAttribute("allow","clipboard-write");
  document.body.appendChild(fr);
  const d=fr.contentDocument;
  d.open(); d.write(html); d.close();
  document.querySelector(".wrap").style.display="none";
}
function fail(stage,err){
  const e=document.getElementById("e");
  e.textContent=stage+": "+(err && err.message ? err.message : err);
}
(async()=>{
  try{
    if(!(crypto&&crypto.subtle)) return fail("This browser blocks crypto here","open in Chrome over https");
    const saved=localStorage.getItem("fpl.k");
    if(saved){
      try{
        const k=await crypto.subtle.importKey("jwk",JSON.parse(saved),{name:"AES-GCM"},true,["decrypt"]);
        await unlockWith(k);
      }catch(e){ localStorage.removeItem("fpl.k"); }
    }
  }catch(e){ fail("startup",e); }
})();
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault(); const e=document.getElementById("e"); e.textContent="Unlocking\u2026";
  let key;
  try{ key=await deriveKey(document.getElementById("p").value); }
  catch(err){ return fail("key derivation",err); }
  try{
    await unlockWith(key);
    e.textContent="";
    try{ localStorage.setItem("fpl.k",JSON.stringify(await crypto.subtle.exportKey("jwk",key))); }catch(_){}
  }catch(err){
    localStorage.removeItem("fpl.k");
    if(err && err.name==="OperationError"){ e.textContent="Wrong passphrase."; }
    else fail("render",err);
  }
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
