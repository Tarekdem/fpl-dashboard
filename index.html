const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function unlockWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.nonce)},key,b64(DATA.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{
  const saved=localStorage.getItem("fpl.k");
  if(saved){ try{ const k=await crypto.subtle.importKey("jwk",JSON.parse(saved),{name:"AES-GCM"},true,["decrypt"]); await unlockWith(k); return; }catch(e){ localStorage.removeItem("fpl.k"); } }
})();
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault(); const e=document.getElementById("e"); e.textContent="Unlocking…";
  try{ const k=await deriveKey(document.getElementById("p").value);
       localStorage.setItem("fpl.k",JSON.stringify(await crypto.subtle.exportKey("jwk",k)));
       await unlockWith(k);
  }catch(err){ localStorage.removeItem("fpl.k"); e.textContent="Wrong passphrase."; }
};
